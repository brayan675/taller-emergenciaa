<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculadora {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 260px;
        }

        input {
            width: 100%;
            height: 45px;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: right;
            box-sizing: border-box;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .operador {
            background: orange;
        }

        .limpiar {
            background: #ff5555;
        }
    </style>
</head>
