<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculadora {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 260px;
        }

        input {
            width: 100%;
            height: 45px;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: right;
            box-sizing: border-box;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .operador {
            background: orange;
        }

        .limpiar {
            background: #ff5555;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" id="pantalla" readonly>

        <div class="botones">
            <button class="limpiar" onclick="limpiar()">C</button>
            <button onclick="borrarUno()">⌫</button>
            <button class="operador" onclick="agregar('%')">%</button>
            <button class="operador" onclick="agregar('/')">÷</button>

            <button onclick="agregar('7')">7</button>
            <button onclick="agregar('8')">8</button>
            <button onclick="agregar('9')">9</button>
            <button class="operador" onclick="agregar('*')">×</button>

            <button onclick="agregar('4')">4</button>
            <button onclick="agregar('5')">5</button>
            <button onclick="agregar('6')">6</button>
            <button class="operador" onclick="agregar('-')">−</button>

            <button onclick="agregar('1')">1</button>
            <button onclick="agregar('2')">2</button>
            <button onclick="agregar('3')">3</button>
            <button class="operador" onclick="agregar('+')">+</button>

            <button onclick="agregar('0')">0</button>
            <button onclick="agregar('.')">.</button>
            <button onclick="calcular()">=</button>
        </div>
    </div>

    <script>

    </script>

</body>
</html>
